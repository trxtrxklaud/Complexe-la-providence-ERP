openapi: 3.0.3
info:
  title: Complexe La Providence ERP API
  description: >-
    Internal API for the Complexe La Providence school management system.
    Proprietary software — owner: Complexe La Providence — Prod RH, Sidi Bouzid, Tunisie.
  version: 1.0.0
  contact:
    name: Complexe La Providence — Prod RH

servers:
  - url: http://localhost:8000/api
    description: Local Development
  - url: https://erp.laprovidence.ma/api
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Student:
      type: object
      properties:
        id:
          type: integer
        student_code:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        gender:
          type: string
          nullable: true
          enum: [male, female]
        mother_name:
          type: string
          nullable: true

    Enrollment:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        level:
          $ref: '#/components/schemas/Level'
        section:
          $ref: '#/components/schemas/Section'

security:
  - bearerAuth: []

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Login and get access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: admin@laprovidence.ma
                password:
                  type: string
                  example: ChangeMe123!
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    type: object

  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data

  /students:
    get:
      tags:
        - Students
      summary: List students with current enrollment
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: level_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated list of students

  /students/enroll:
    post:
      tags:
        - Students
      summary: Enroll a new student
      description: >-
        Only the name and the target level are mandatory: the school registers pupils
        by name first and completes guardian data later.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - level_id
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                level_id:
                  type: integer
                section_id:
                  type: integer
                dob:
                  type: string
                  format: date
                gender:
                  type: string
                  enum: [male, female]
                guardian_first_name:
                  type: string
                guardian_last_name:
                  type: string
                mother_name:
                  type: string
                guardian_phone:
                  type: string
                mother_phone:
                  type: string
      responses:
        '201':
          description: Student enrolled successfully
